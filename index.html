<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fernando Iguibejeres — Software Architect &amp; Full Stack Developer</title>
<meta name="description" content="Fernando Iguibejeres — Software Architect y Full Stack Developer en Buenos Aires. 15+ años de experiencia: Mobeats, MercadoLibre, Oracle, OSDE y más." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F5F7F2;--surface:#ffffff;--band:#0F2631;--ink:#0F2631;--muted:#5A6A72;--line:rgba(15,38,49,.13);--soft:rgba(15,38,49,.04);--onband:#EAF2F5;--onbandmuted:rgba(234,242,245,.62);--accent:#2E9EBC;--accent2:#7BA658}
[data-theme="dark"]{--bg:#0B1A21;--surface:#12252E;--band:#081419;--ink:#EAF2F5;--muted:#94A8B1;--line:rgba(234,242,245,.15);--soft:rgba(234,242,245,.05);--onband:#EAF2F5;--onbandmuted:rgba(234,242,245,.58)}
html{scroll-behavior:smooth}
body{margin:0;padding:0;font-family:'Montserrat',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-wrap:pretty}
*{box-sizing:border-box}
section[id]{scroll-margin-top:96px}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent2)}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes heroIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes photoIn{from{opacity:0;transform:scale(.94) translateY(18px)}to{opacity:1;transform:none}}
@keyframes blobIn{from{opacity:0;transform:scale(.5)}to{opacity:.5;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.app{background:var(--bg);color:var(--ink);min-height:100vh;font-family:'Montserrat',system-ui,sans-serif;transition:background .5s ease,color .4s ease}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb, var(--bg) 86%, transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);transition:background .4s ease,border-color .4s ease}
.nav-progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--accent2))}
.nav-inner{max-width:1120px;margin:0 auto;padding:12px 32px;min-height:68px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 22px}
.nav-brand{font-weight:700;font-size:15px;letter-spacing:-.2px;color:var(--ink);display:flex;align-items:baseline;gap:8px;flex:0 0 auto;white-space:nowrap}
.nav-brand-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.nav-spacer{flex:1 1 auto;min-width:12px}
.nav-links{display:flex;align-items:center;gap:22px;flex:0 0 auto}
.nav-link{position:relative;font-size:13px;font-weight:500;letter-spacing:.2px;color:var(--muted);white-space:nowrap;padding:6px 0;transition:color .25s ease}
.nav-link:hover,.nav-link.is-active{color:var(--ink)}
.nav-link-underline{position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);transition:transform .32s cubic-bezier(.22,1,.36,1)}
.nav-link-underline.is-active{transform:scaleX(1)}
.mode-switch,.layout-switch{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;flex:0 0 auto}
.lang-switch{display:flex;align-items:center;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;flex:0 0 auto}
.mode-btn{border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.2px;padding:6px 12px;border-radius:999px;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px;transition:background .25s ease,color .25s ease}
.mode-btn.is-active{background:var(--ink);color:var(--bg)}
.layout-btn{border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;width:28px;height:26px;border-radius:999px;background:transparent;color:var(--muted);transition:background .25s ease,color .25s ease}
.layout-btn.is-active{background:var(--ink);color:var(--bg)}
.lang-btn{border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.6px;padding:6px 11px;border-radius:999px;background:transparent;color:var(--muted)}
.lang-btn.is-active{background:var(--ink);color:var(--bg)}
.theme-btn{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;font-size:14px;line-height:1}
.theme-btn:hover{background:var(--soft)}

/* Shared buttons */
.btn-solid{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;letter-spacing:.3px}
.btn-solid:hover{opacity:.86;color:var(--bg)}
.btn-outline{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;letter-spacing:.3px}
.btn-outline:hover{background:var(--soft);color:var(--ink)}
.btn-solid-onband{display:inline-flex;align-items:center;padding:15px 26px;border-radius:999px;background:var(--onband);color:var(--band);font-size:14px;font-weight:600}
.btn-solid-onband:hover{opacity:.88;color:var(--band)}
.btn-outline-onband{display:inline-flex;align-items:center;padding:15px 26px;border-radius:999px;border:1px solid rgba(234,242,245,.28);color:var(--onband);font-size:14px;font-weight:600}
.btn-outline-onband:hover{background:rgba(234,242,245,.1);color:var(--onband)}

/* Hero A */
.hero-a{max-width:1120px;margin:0 auto;padding:96px 32px 88px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:64px;align-items:center}
.hero-a-kicker{font-size:12px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;color:var(--accent);margin-bottom:22px;animation:heroIn .7s cubic-bezier(.22,1,.36,1) .05s both}
.hero-a-title{margin:0;font-size:74px;line-height:.94;letter-spacing:-3px;font-weight:800;color:var(--ink);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .14s both}
.hero-a-lede{margin:26px 0 0;font-size:20px;line-height:1.5;font-weight:400;color:var(--muted);max-width:30em;animation:heroIn .8s cubic-bezier(.22,1,.36,1) .26s both}
.hero-a-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px;animation:heroIn .8s cubic-bezier(.22,1,.36,1) .36s both}
.hero-a-stats{display:flex;gap:36px;margin-top:52px;padding-top:30px;border-top:1px solid var(--line);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .46s both}
.stat-num{font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--ink)}
.stat-label{font-size:12px;font-weight:500;letter-spacing:.4px;color:var(--muted);margin-top:4px}
.hero-a-photo-wrap{position:relative}
.hero-a-blob1{position:absolute;top:-26px;right:-18px;width:148px;height:148px;border-radius:50%;background:var(--accent2);opacity:.5;animation:blobIn .9s cubic-bezier(.22,1,.36,1) .5s both}
.hero-a-blob2{position:absolute;bottom:-30px;left:-34px;width:96px;height:96px;border-radius:50%;background:var(--accent);opacity:.35;animation:blobIn .9s cubic-bezier(.22,1,.36,1) .62s both}
.hero-a-photo{position:relative;width:100%;aspect-ratio:1;object-fit:cover;border-radius:28px;background:var(--surface);box-shadow:0 24px 60px rgba(15,38,49,.18);animation:photoIn .9s cubic-bezier(.22,1,.36,1) .2s both}

/* Hero B */
.hero-b{background:var(--band);padding:84px 32px 78px}
.hero-b-inner{max-width:780px;margin:0 auto;text-align:center}
.hero-b-photo{width:176px;height:176px;object-fit:cover;border-radius:50%;border:3px solid rgba(234,242,245,.18);box-shadow:0 18px 44px rgba(0,0,0,.35);animation:photoIn .9s cubic-bezier(.22,1,.36,1) .08s both}
.hero-b-title{margin:30px 0 0;font-size:56px;line-height:1;letter-spacing:-2.2px;font-weight:800;color:var(--onband);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .2s both}
.hero-b-divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:24px 0 0}
.hero-b-divider-line{height:1px;width:54px;background:rgba(234,242,245,.25)}
.hero-b-divider-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.hero-b-lede{margin:24px auto 0;font-size:18px;line-height:1.6;color:var(--onbandmuted);max-width:34em}
.hero-b-ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:36px}

/* Hero C */
.hero-c{max-width:1120px;margin:0 auto;padding:104px 32px 84px}
.hero-c-top{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.hero-c-photo{width:76px;height:76px;object-fit:cover;border-radius:50%;background:var(--surface)}
.hero-c-name{font-size:15px;font-weight:700;letter-spacing:-.2px;color:var(--ink)}
.hero-c-kicker{font-size:12px;font-weight:500;letter-spacing:2.6px;text-transform:uppercase;color:var(--accent);margin-top:5px}
.hero-c-title{margin:0;font-size:68px;line-height:1.06;letter-spacing:-2.6px;font-weight:300;color:var(--muted);max-width:20em}
.hero-c-title strong{font-weight:800;color:var(--ink)}
.hero-c-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:44px}

/* Hero D */
.hero-d{max-width:1120px;margin:0 auto;padding:40px 32px 76px}
.hero-d-panel{background:var(--band);border-radius:32px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:stretch;overflow:hidden;animation:photoIn .9s cubic-bezier(.22,1,.36,1) both}
.hero-d-photo-box{border-radius:24px;overflow:hidden;min-height:380px;background:var(--surface)}
.hero-d-photo{width:100%;height:100%;min-height:380px;object-fit:cover;display:block}
.hero-d-text{padding:40px 36px 34px;display:flex;flex-direction:column;justify-content:center}
.hero-d-kicker{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-bottom:18px;animation:heroIn .7s cubic-bezier(.22,1,.36,1) .18s both}
.hero-d-title{margin:0;font-size:46px;line-height:1.02;letter-spacing:-2px;font-weight:800;color:var(--onband);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .26s both}
.hero-d-lede{margin:20px 0 0;font-size:16px;line-height:1.6;color:var(--onbandmuted);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .34s both}
.hero-d-stats{display:grid;grid-template-columns:repeat(3,auto);gap:28px;justify-content:start;margin:30px 0 0;padding-top:24px;border-top:1px solid rgba(234,242,245,.16);animation:heroIn .8s cubic-bezier(.22,1,.36,1) .42s both}
.hero-d-stat-num{font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--onband)}
.hero-d-stat-label{font-size:11px;font-weight:500;color:var(--onbandmuted);margin-top:3px}
.hero-d-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px;animation:heroIn .8s cubic-bezier(.22,1,.36,1) .5s both}
.hero-d-cta-solid{display:inline-flex;align-items:center;padding:14px 24px;border-radius:999px;background:var(--onband);color:var(--band);font-size:13px;font-weight:600;transition:transform .22s ease,opacity .22s ease}
.hero-d-cta-solid:hover{opacity:.9;color:var(--band);transform:translateY(-2px)}
.hero-d-cta-outline{display:inline-flex;align-items:center;padding:14px 24px;border-radius:999px;border:1px solid rgba(234,242,245,.28);color:var(--onband);font-size:13px;font-weight:600;transition:transform .22s ease,background .22s ease}
.hero-d-cta-outline:hover{background:rgba(234,242,245,.1);color:var(--onband);transform:translateY(-2px)}

/* Hero E */
.hero-e{padding:76px 0 60px;overflow:hidden}
.hero-e-inner{max-width:1360px;margin:0 auto;padding:0 32px}
.hero-e-top{display:flex;align-items:center;gap:18px;margin-bottom:26px;animation:heroIn .7s cubic-bezier(.22,1,.36,1) both}
.hero-e-photo{width:62px;height:62px;object-fit:cover;border-radius:50%;background:var(--surface)}
.hero-e-kicker{font-size:12px;font-weight:600;letter-spacing:3.2px;text-transform:uppercase;color:var(--accent)}
.hero-e-divider{flex:1;height:1px;background:var(--line)}
.hero-e-location{font-size:12px;font-weight:500;letter-spacing:.4px;color:var(--muted)}
.hero-e-title-1{margin:0;font-size:clamp(48px,11.2vw,172px);line-height:.86;letter-spacing:-.055em;font-weight:800;color:var(--ink);text-transform:uppercase;animation:heroIn .9s cubic-bezier(.22,1,.36,1) .1s both}
.hero-e-title-2{margin:0;font-size:clamp(48px,11.2vw,172px);line-height:.86;letter-spacing:-.055em;font-weight:300;color:var(--muted);text-transform:uppercase;animation:heroIn .9s cubic-bezier(.22,1,.36,1) .2s both}
.hero-e-bottom{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:40px;align-items:end;margin-top:44px;animation:heroIn .9s cubic-bezier(.22,1,.36,1) .32s both}
.hero-e-lede{margin:0;font-size:19px;line-height:1.55;color:var(--muted);max-width:32em}
.hero-e-ctas{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.hero-e-cta-solid{display:inline-flex;align-items:center;padding:15px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;transition:transform .22s ease,opacity .22s ease}
.hero-e-cta-solid:hover{opacity:.88;transform:translateY(-2px)}
.hero-e-cta-outline{display:inline-flex;align-items:center;padding:15px 26px;border-radius:999px;border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600;transition:transform .22s ease,background .22s ease}
.hero-e-cta-outline:hover{background:var(--soft);color:var(--ink);transform:translateY(-2px)}
.hero-e-marquee-wrap{margin-top:60px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);animation:heroIn .9s cubic-bezier(.22,1,.36,1) .44s both}
.hero-e-marquee-track{display:flex;width:max-content;animation:marquee 34s linear infinite}
.hero-e-marquee-item{width:108px;height:44px;margin:0 26px;flex:none;background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.5;filter:grayscale(1)}

/* Experience section */
.section-exp{max-width:1120px;margin:0 auto;padding:72px 32px 24px}
.section-exp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;margin-bottom:44px}
.section-kicker{font-size:12px;font-weight:600;letter-spacing:3.4px;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.section-title{margin:0;font-size:40px;line-height:1.05;letter-spacing:-1.6px;font-weight:800;color:var(--ink)}
.section-title.is-spaced{margin:0 0 44px}
.btn-toggle{border:1px solid var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.4px;padding:10px 18px;border-radius:999px;cursor:pointer}
.btn-toggle:hover{background:var(--soft);color:var(--ink)}
.job-list{display:flex;flex-direction:column}
.job-row{display:grid;grid-template-columns:128px 1fr;gap:0;border-top:1px solid var(--line)}
.job-years{padding:30px 20px 30px 0;font-size:12px;font-weight:600;letter-spacing:.6px;color:var(--muted);line-height:1.6}
.job-now-badge{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 9px;border-radius:999px;background:var(--accent2);color:#12250D;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.job-header{display:flex;align-items:center;gap:20px;padding:28px 4px 28px 0;cursor:pointer;transition:background .25s ease,padding-left .25s ease}
.job-header:hover{background:var(--soft);padding-left:10px}
.job-logo-box{width:52px;height:52px;flex:none;border-radius:12px;background:#ffffff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.job-logo{width:76%;height:76%;background-size:contain;background-position:center;background-repeat:no-repeat}
.job-text{flex:1;min-width:0}
.job-role{font-size:19px;font-weight:700;letter-spacing:-.4px;color:var(--ink)}
.job-company{font-size:14px;font-weight:500;color:var(--muted);margin-top:4px}
.job-chevron{width:30px;height:30px;flex:none;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;line-height:1;transition:transform .42s cubic-bezier(.22,1,.36,1),border-color .25s ease,color .25s ease}
.job-detail-rows{display:grid;transition:grid-template-rows .42s cubic-bezier(.22,1,.36,1)}
.job-detail-inner{overflow:hidden;min-height:0}
.job-detail-content{padding:0 0 32px 72px;transition:opacity .34s ease .06s,transform .42s cubic-bezier(.22,1,.36,1) .04s}
.job-desc{margin:0;font-size:15px;line-height:1.68;color:var(--muted);max-width:62ch}
.job-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tag{font-size:11px;font-weight:600;letter-spacing:.4px;padding:6px 11px;border-radius:6px;background:var(--soft);border:1px solid var(--line);color:var(--ink);transition:background .2s ease,transform .2s ease}
.tag:hover{background:var(--accent);color:#ffffff;transform:translateY(-2px)}
.job-link{display:inline-flex;align-items:center;gap:7px;margin-top:22px;font-size:13px;font-weight:600;letter-spacing:.3px}
.job-list-end{border-top:1px solid var(--line)}

/* Stack section */
.section-stack{max-width:1120px;margin:0 auto;padding:76px 32px 12px}
.stack-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.stack-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease,border-color .3s ease}
.stack-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(15,38,49,.1);border-color:var(--accent)}
.stack-card-label{font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--ink);margin-bottom:16px;display:flex;align-items:center;gap:9px}
.stack-card-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.stack-items{display:flex;flex-wrap:wrap;gap:7px}
.stack-item{font-size:12px;font-weight:500;color:var(--muted);padding:5px 10px;border-radius:6px;background:var(--soft)}

/* Contact section */
.section-contact{max-width:1120px;margin:0 auto;padding:88px 32px 96px}
.contact-panel{background:var(--band);border-radius:28px;padding:68px 56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;align-items:center}
.contact-title{margin:0;font-size:42px;line-height:1.06;letter-spacing:-1.8px;font-weight:800;color:var(--onband)}
.contact-lede{margin:20px 0 0;font-size:17px;line-height:1.6;color:var(--onbandmuted);max-width:34em}
.contact-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.contact-cta-solid{display:inline-flex;align-items:center;padding:15px 28px;border-radius:999px;background:var(--onband);color:var(--band);font-size:14px;font-weight:600}
.contact-cta-solid:hover{opacity:.88;color:var(--band)}
.contact-cta-outline{display:inline-flex;align-items:center;padding:15px 28px;border-radius:999px;border:1px solid rgba(234,242,245,.28);color:var(--onband);font-size:14px;font-weight:600}
.contact-cta-outline:hover{background:rgba(234,242,245,.1);color:var(--onband)}
.contact-links{display:flex;flex-direction:column;gap:2px}
.contact-links-label{font-size:11px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:rgba(234,242,245,.45);margin-bottom:14px}
.contact-link{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(234,242,245,.14);color:var(--onband);font-size:15px;font-weight:500}
.contact-link:hover{color:var(--accent2)}
.contact-link.is-last{border-bottom:0}
.contact-link-arrow{opacity:.5}
.contact-location{margin-top:24px;font-size:13px;line-height:1.6;color:rgba(234,242,245,.45)}

/* Footer */
.footer{border-top:1px solid var(--line);padding:30px 32px}
.footer-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:12px;font-weight:500;color:var(--muted)}

/* Console mode */
.console{min-height:calc(100vh - 68px);background:radial-gradient(circle at 18% 0%, #12303D 0%, #081419 62%);padding:48px 28px 72px;animation:riseIn .4s ease both}
.console-window{max-width:980px;margin:0 auto;border-radius:12px;overflow:hidden;background:#061115;border:1px solid rgba(234,242,245,.14);box-shadow:0 40px 90px rgba(0,0,0,.5)}
.console-titlebar{display:flex;align-items:center;gap:8px;padding:13px 16px;background:#0C1E25;border-bottom:1px solid rgba(234,242,245,.1)}
.console-dot{width:11px;height:11px;border-radius:50%}
.console-dot.is-red{background:#E05A4E}
.console-dot.is-yellow{background:#D8A548}
.console-dot.is-green{background:#7BA658}
.console-path{margin-left:12px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:rgba(234,242,245,.45)}
.console-body{padding:24px 26px 30px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13.5px;line-height:1.85;color:#C8DBE2;max-height:60vh;overflow-y:auto}
.console-line{margin-bottom:3px}
.console-line-cmd{display:flex;gap:9px;margin-top:16px}
.console-arrow{color:#7BA658}
.console-prompt{color:#2E9EBC}
.console-cmdtext{color:#EAF2F5}
.console-line-out{color:rgba(200,219,226,.82);white-space:pre-wrap}
.console-line-kv{display:flex;gap:14px;flex-wrap:wrap}
.console-kv-key{color:#7BA658;min-width:148px;flex:none}
.console-kv-val{color:rgba(200,219,226,.9)}
.console-cursor{width:9px;height:17px;background:#EAF2F5;display:inline-block;animation:blink 1.1s step-end infinite}
.console-cmdbar{padding:16px 26px 20px;border-top:1px solid rgba(234,242,245,.1);display:flex;gap:8px;flex-wrap:wrap;background:#081419}
.console-cmd-btn{border:1px solid rgba(46,158,188,.4);background:rgba(46,158,188,.1);color:#7FCBE0;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;padding:7px 13px;border-radius:6px;transition:background .2s ease,transform .2s ease}
.console-cmd-btn:hover{background:rgba(46,158,188,.26);transform:translateY(-2px)}

/* IDE mode */
.ide{min-height:calc(100vh - 68px);background:#0B1A21;animation:riseIn .4s ease both}
.ide-grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(254px,1fr));min-height:calc(100vh - 68px)}
.ide-sidebar{max-width:254px;background:#081419;border-right:1px solid rgba(234,242,245,.09);padding:22px 0}
.ide-explorer-label{padding:0 18px 16px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:rgba(234,242,245,.38)}
.ide-folder{padding:0 18px 10px;display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:rgba(234,242,245,.72)}
.ide-folder-arrow{color:#7BA658}
.ide-file{display:flex;align-items:center;gap:9px;padding:7px 18px 7px 34px;cursor:pointer;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;transition:background .18s ease,color .18s ease}
.ide-file:hover{background:rgba(234,242,245,.06)}
.ide-sidebar-links{margin-top:24px;padding:14px 18px 0;border-top:1px solid rgba(234,242,245,.09);display:flex;flex-direction:column;gap:4px}
.ide-sidebar-link{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:#7FCBE0}
.ide-main{display:flex;flex-direction:column;min-width:0}
.ide-tabbar{display:flex;align-items:stretch;background:#061115;border-bottom:1px solid rgba(234,242,245,.09)}
.ide-tab{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#0B1A21;border-right:1px solid rgba(234,242,245,.09);border-top:2px solid var(--accent);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px;color:#EAF2F5}
.ide-tab-icon{color:#7BA658}
.ide-tab-close{color:rgba(234,242,245,.35)}
.ide-editor{flex:1;display:flex;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:13px;line-height:2.05;padding:22px 0 40px;overflow-x:auto}
.ide-gutter{flex:none;width:58px;text-align:right;padding-right:18px;color:rgba(234,242,245,.22);user-select:none}
.ide-code{flex:1;min-width:0;padding-right:30px}
.ide-code-line{white-space:pre-wrap}
.ide-statusbar{padding:8px 20px;background:var(--accent);display:flex;align-items:center;gap:18px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;color:#04222C}
.ide-statusbar-spacer{flex:1}

</style>
